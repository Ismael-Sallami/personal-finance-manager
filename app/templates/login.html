{% extends "base.html" %}
{% block title %}Sign in · Finance Manager{% endblock %}
{% block auth %}
<div class="min-h-screen flex items-center justify-center px-4"
     style="background:radial-gradient(900px 500px at 50% -10%, rgba(0,229,255,0.12), transparent), #0b0f14;">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-3xl font-extrabold"><span class="text-accent">●</span> Finance Manager</div>
      <p class="text-dim text-sm mt-2">Track spending, investments and net worth</p>
    </div>
    <div class="glass border border-white/10 rounded-2xl p-7 shadow-2xl">
      {% if error %}
      <div class="mb-4 text-sm text-danger bg-danger/10 border border-danger/30 rounded-lg px-3 py-2">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
          <label class="block text-xs text-dim mb-1">Email</label>
          <input name="email" type="email" required autofocus
                 class="w-full bg-panel2 border border-white/10 rounded-lg px-3 py-2.5 text-sm focus:border-accent focus:outline-none">
        </div>
        <div>
          <label class="block text-xs text-dim mb-1">Password</label>
          <input name="password" type="password" required
                 class="w-full bg-panel2 border border-white/10 rounded-lg px-3 py-2.5 text-sm focus:border-accent focus:outline-none">
        </div>
        <button class="w-full bg-accent text-bg font-semibold rounded-lg py-2.5 hover:brightness-110 transition">
          Sign in →
        </button>
      </form>
    </div>
    <p class="text-center text-[11px] text-dim mt-6 font-mono">encrypted connection · signed session</p>
  </div>
</div>
{% endblock %}
